spring.application.name=backend-test

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:blog_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Không chạy file data.sql/schema.sql nếu có
spring.sql.init.mode=never

# JWT dùng riêng cho test
jwt.signerKey=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Tài khoản admin khởi tạo khi test
app.admin.username=admin_test
app.admin.password=123456789